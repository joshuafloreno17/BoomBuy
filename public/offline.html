<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>You're Offline — BoomBuy</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #fffaf8;
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: #172033;

            padding: 24px;
        }

        .card {
            max-width: 380px;
            text-align: center;
        }

        .icon {
            font-size: 56px;
            margin-bottom: 18px;
        }

        h1 {
            font-family: 'Baloo 2', sans-serif;
            font-size: 26px;
            margin-bottom: 10px;
        }

        h1 span {
            color: #e8420f;
        }

        p {
            color: #8d6c62;
            font-size: 14px;
            line-height: 1.7;
            margin-bottom: 26px;
        }

        button {
            background: #e8420f;
            color: white;
            border: none;

            padding: 13px 24px;
            border-radius: 12px;

            font-family: inherit;
            font-size: 13px;
            font-weight: 800;

            cursor: pointer;
            transition: 0.2s ease;
        }

        button:hover {
            background: #cf380b;
        }
    </style>
</head>

<body>

    <div class="card">
        <div class="icon">📡</div>

        <h1>Boom<span>Buy</span> is offline</h1>

        <p>
            Looks like you've lost your connection. Check your internet
            and try again — some pages you've already visited may still
            be available.
        </p>

        <button onclick="location.reload()">
            Try Again
        </button>
    </div>

</body>

</html>
